[package]
name = "infinite-chat"
version = "0.1.0"
edition = "2024"
# 1.88, not 1.85. `time` 0.3.47 — pulled in via tower-cookies, and the version
# that fixes RUSTSEC-2026-0009 — requires it. The declared MSRV is a claim other
# people build against, so it tracks the dependency tree rather than the last
# time somebody thought about it.
rust-version = "1.88"
description = "Ephemeral multi-room WebSocket chat server"
license = "MIT"
publish = false

[dependencies]
# Async runtime. Not "full": this server never touches `tokio::fs` or
# `tokio::process` — no file I/O beyond `include_str!` at compile time, no
# subprocess spawning — so `fs` and `process` compiled in nothing this binary
# ever calls, only surface `cargo audit`/a future memory-safety bug in tokio
# itself would have to cover for no reason. Named for exactly what this
# crate's own source uses: the multi-threaded runtime and `#[tokio::main]`
# (`rt-multi-thread`, `macros`), `TcpListener` (`net`), the broadcast/mutex/
# rwlock primitives every room uses (`sync`), intervals and timeouts (`time`),
# and `ctrl_c` for graceful shutdown (`signal`).
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
] }

# Web framework
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = "0.8.0"
tower-http = { version = "0.7.0", features = ["cors", "set-header"] }
http = "1.4.2"
tower-cookies = "0.11.0"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Utilities
futures = "0.3.33"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
rand = "0.10.2"
bytes = "1.12.1"
regex = "1.13.1"
thiserror = "2.0.19"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Content processing
# default-features pull in a CLI binary (clap, xdg, shell-words) and syntect-
# based syntax highlighting — this server never invokes either: ComrakOptions
# never configures a highlighting adapter, and nothing here is a CLI. Disabling
# them drops ~15 transitive crates, including every crate behind three RUSTSEC
# advisories (quick-xml, bincode) and one unmaintained warning (yaml-rust).
comrak = { version = "0.54.0", default-features = false }
ammonia = "4.1.4"

# The page's one `<style>` block is named in the CSP by its content hash
# rather than by `'unsafe-inline'` — computed once at startup from the exact
# bytes `include_str!` embedded, the same shape as the `fnv1a` cache-busting
# hash for `/app.js` already uses. RustCrypto's `sha2`, not a hand-rolled
# implementation: `fnv1a` is a cache key with no security property to get
# wrong; this result goes in a header a browser trusts to decide what runs.
# `base64` was already being compiled in, transitively, as one of axum's own
# dependencies — declared directly rather than hand-rolled for the same
# reason as `sha2`, and at zero additional supply-chain cost since it was
# already in the dependency tree.
sha2 = "0.10.9"
base64 = "0.22.1"

# `nova` room only (routes.rs/session/nova.rs): a hybrid classical/post-quantum
# secure channel layered under wss:// for that one room's message payloads.
# Private upstream repo, so pinned to an exact commit rather than a branch —
# unlike the container base images (ENGINEERING-STANDARDS.md §9.4, "these_
# images_track_latest_on_purpose"), an unreviewed change to a cryptography
# dependency reaching the running server is a different risk category than an
# unreviewed OS patch level, so this is bumped deliberately by a reviewed PR
# (.github/workflows/novachannel-watch.yml opens one when upstream moves),
# never automatically.
novachannel = { git = "https://github.com/cameronaaron/internet.git", package = "novachannel", rev = "f4bf7881e6d1da92daf28c9c5c5805fe02a4e2ad" }
# `nova` room, Phase 2: anonymous rate-limited posting. Verification (cheap —
# ~0.2ms native, measured) runs here; proving runs client-side in nova-wasm,
# since only the holder of a member's `sk` may ever produce a valid proof —
# a server that could prove on a client's behalf could also forge one.
novachannel-rln = { git = "https://github.com/cameronaaron/internet.git", package = "novachannel-rln", rev = "f4bf7881e6d1da92daf28c9c5c5805fe02a4e2ad" }
# Backs the nullifier set: which epoch-nullifier bucket the server touched
# checking for a double-post is exactly the access-pattern leak this crate
# exists to close (its own module doc), and it is the one primitive from the
# full stack that fits with no design compromise (see the nova room plan).
novachannel-oram = { git = "https://github.com/cameronaaron/internet.git", package = "novachannel-oram", rev = "f4bf7881e6d1da92daf28c9c5c5805fe02a4e2ad" }
# novachannel-rln's own public API (`air::verify`, `PublicInputs`, the
# `Proof` type its `RlnMessage` frame carries) is built directly on
# winterfell's types rather than wrapping them, so deserialising a proof
# off the wire needs this crate directly too. Pinned to the exact version
# novachannel-rln itself depends on (its Cargo.toml, not a rev — this is a
# normal crates.io dependency, not the private fork).
winterfell = "0.13"
# novachannel-oram's `PathOram::read`/`write` are generic over `rand 0.8`'s
# `Rng` trait specifically (that crate's own pin), which is a different type
# from this crate's own `rand 0.10`'s `Rng` as far as the compiler is
# concerned — Cargo happily resolves both majors side by side, but calling
# into the ORAM needs an RNG built from *this* version to satisfy its bound.
rand08 = { package = "rand", version = "0.8" }

[dev-dependencies]
# `test-util` gives tests simulated time, so the housekeeping loops can be
# asserted to actually run on their 60-second intervals without a test that
# takes 60 seconds. It is a dev-dependency feature, so the release build never
# gets the pausable clock. Not "full" here either — the same reasoning as the
# main dependency above, plus `io-util` for `tokio_tungstenite`'s stream
# handling in the integration tests. No `fs`/`process`: the full suite builds
# and passes without them, which is the actual check — not an assumption
# carried over from the release binary's own list.
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
    "test-util",
] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"

[profile.release]
# The binary ships inside a Cloudflare Container: a smaller image is a faster
# cold start. LTO and a single codegen unit cost build time, not runtime.
lto = "fat"
codegen-units = 1
strip = "symbols"
# panic = "abort" is deliberately NOT set. Tokio confines a panicking task to
# that task; under abort, one panic in one connection handler would kill the
# process and disconnect every user in every room. Unwinding here is a
# blast-radius decision, not an oversight — see ENGINEERING-STANDARDS.md §5.
