[package]
name = "infinite-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.35.1", features = ["full"] }

# Web Framework
axum = { version = "0.7.9", features = ["ws", "http2"] }
axum-server = { version = "0.6.0" }  # Remove features specification
tower = { version = "0.4.13", features = ["full"] }
tower-http = { version = "0.5.1", features = [
    "cors",
    "trace",
    "set-header",
    "limit",
    "auth"
] }
hyper = { version = "1.1.0", features = ["full"] }
async-trait = "0.1.77"

# Serialization
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"

# Utilities
futures = "0.3.30"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8.5"

# Logging & Monitoring
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
metrics = "0.21"
metrics-exporter-prometheus = { version = "0.12", features = ["http-listener"] }

# Content Processing
comrak = "0.20.0"
ammonia = "3.3.0"

# Security
tower-cookies = "0.9.0"
http = "1.0.0"
rustls = "0.21"
rustls-pemfile = "1.0"

# Add these new dependencies
regex = "1.10.2"
lazy_static = "1.5.0"
thiserror = "1.0"
[dev-dependencies]
# Move test-only dependencies here
tokio = { version = "1", features = ["full"] }
# ... other test dependencies ...
