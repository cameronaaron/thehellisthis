[package]
name = "infinite-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.42.0", features = ["full"] }

# Web Framework
axum = { version = "0.8.8", features = ["ws", "macros"] }
axum-server = "0.8.0"
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.8", features = [
    "cors",
    "trace",
    "set-header",
    "limit",
    "auth"
] }
hyper = { version = "1.8.1", features = ["full"] }
async-trait = "0.1.89"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Utilities
futures = "0.3.31"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
rand = "0.8.5"
bytes = "1.11.0"

# Logging & Monitoring
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
metrics = "0.24.3"
metrics-exporter-prometheus = { version = "0.18.1", features = ["http-listener"] }

# Content Processing
comrak = "0.49.0"
ammonia = "4.1.2"

# Security
tower-cookies = "0.11.0"
http = "1.4.0"

# Utilities
regex = "1.12.2"
lazy_static = "1.5.0"
thiserror = "2.0.17"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = "0.24.0"
url = "2.5.4"
