<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231a73e8' rx='20' width='100' height='100'/%3E%3Cpath fill='%23fff' d='M30 35h40c2.8 0 5 2.2 5 5v20c0 2.8-2.2 5-5 5H55l-10 10v-10H30c-2.8 0-5-2.2-5-5V40c0-2.8 2.2-5 5-5z'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root {
    --primary: #1a73e8;
    --primary-hover: #1557b0;
    --primary-pressed: #174ea6;
    --primary-container: #e8f0fe;
    --on-primary: #ffffff;
    --on-primary-container: #1a73e8;
    --secondary: #5f6368;
    --secondary-container: #e8eaed;
    --surface: #ffffff;
    --surface-dim: #f8f9fa;
    --surface-container: #f1f3f4;
    --surface-container-high: #e8eaed;
    --surface-container-highest: #dadce0;
    --on-surface: #202124;
    --on-surface-variant: #5f6368;
    --outline: #dadce0;
    --outline-variant: #e8eaed;
    --success: #1e8e3e;
    --success-container: #e6f4ea;
    --on-success: #ffffff;
    --warning: #f9ab00;
    --warning-container: #fef7e0;
    --error: #d93025;
    --error-container: #fce8e6;
    --on-error: #ffffff;
    --shadow-1: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    --shadow-2: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
    --shadow-3: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    --radius-xs: 4px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-xxl: 28px;
    --radius-full: 9999px;
    --transition-fast: 100ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-standard: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-emphasis: 300ms cubic-bezier(0.4, 0, 0.2, 1);
}

@media (prefers-color-scheme: dark) {
    :root {
        --primary: #8ab4f8;
        --primary-hover: #aecbfa;
        --primary-pressed: #c9ddfb;
        --primary-container: #394457;
        --on-primary: #062e6f;
        --on-primary-container: #c2e7ff;
        --secondary: #9aa0a6;
        --secondary-container: #3c4043;
        --surface: #202124;
        --surface-dim: #131314;
        --surface-container: #292a2d;
        --surface-container-high: #35363a;
        --surface-container-highest: #3c4043;
        --on-surface: #e8eaed;
        --on-surface-variant: #9aa0a6;
        --outline: #5f6368;
        --outline-variant: #3c4043;
        --success: #81c995;
        --success-container: #1b4d30;
        --on-success: #003a1e;
        --warning: #fdd663;
        --warning-container: #594000;
        --error: #f28b82;
        --error-container: #5c2022;
        --on-error: #601410;
        --shadow-1: 0 1px 2px 0 rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
        --shadow-2: 0 1px 2px 0 rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
        --shadow-3: 0 1px 3px 0 rgba(0,0,0,0.3), 0 4px 8px 3px rgba(0,0,0,0.15);
    }
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

*:focus {
    outline: none;
}

*:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    background: var(--surface-dim);
    color: var(--on-surface);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
}

.app-bar {
    background: var(--surface);
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow-1);
    z-index: 100;
    height: 64px;
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
}

.brand:hover .logo-icon {
    transform: scale(1.05);
}

.logo-icon {
    width: 40px;
    height: 40px;
    background: var(--primary);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--on-primary);
    transition: transform var(--transition-standard);
}

.logo-icon .material-icons-round {
    font-size: 22px;
}

h1 {
    font-family: 'Google Sans', sans-serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--on-surface);
    letter-spacing: -0.25px;
}

.room-info {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
}

.room-badge {
    background: var(--primary-container);
    color: var(--on-primary-container);
    padding: 6px 14px;
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
}

.room-badge::before {
    content: '#';
    opacity: 0.7;
}

.status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 500;
    background: var(--surface-container);
    color: var(--on-surface-variant);
    transition: all var(--transition-fast);
}

.status-chip.connected {
    background: var(--success-container);
    color: var(--success);
}

.status-chip.disconnected {
    background: var(--error-container);
    color: var(--error);
}

.status-chip.connecting {
    background: var(--warning-container);
    color: var(--warning);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
}

.status-chip.connected .status-dot {
    animation: pulse 2s infinite ease-in-out;
}

.status-chip.connecting .status-dot {
    animation: blink 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.9); }
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

#userCount {
    font-size: 13px;
    color: var(--on-surface-variant);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: var(--surface-container);
    border-radius: var(--radius-full);
}

#userCount .material-icons-round {
    font-size: 16px;
}

.nav-link {
    text-decoration: none;
    color: var(--primary);
    font-weight: 500;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    transition: background var(--transition-fast);
    white-space: nowrap;
}

.nav-link:hover {
    background: var(--primary-container);
}

#chat {
    flex: 1;
    padding: 16px 16px 8px;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
}

#chat:empty {
    justify-content: center;
    align-items: center;
}

#chat:empty::before {
    content: 'forum';
    font-family: 'Material Icons Round';
    font-size: 64px;
    color: var(--outline);
    margin-bottom: 16px;
}

#chat:empty::after {
    content: 'No messages yet — be the first to say hello!';
    text-align: center;
    color: var(--on-surface-variant);
    font-size: 15px;
}

.message {
    max-width: min(75%, 520px);
    padding: 10px 14px;
    border-radius: var(--radius-lg);
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    animation: messageSlide 0.25s var(--transition-emphasis);
    position: relative;
}

@keyframes messageSlide {
    from { 
        opacity: 0; 
        transform: translateY(12px) scale(0.98); 
    }
    to { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
    }
}

.message.sent {
    background: var(--primary);
    color: var(--on-primary);
    align-self: flex-end;
    border-bottom-right-radius: var(--radius-xs);
    margin-left: 48px;
}

.message.received {
    background: var(--surface-container);
    color: var(--on-surface);
    align-self: flex-start;
    border-bottom-left-radius: var(--radius-xs);
    margin-right: 48px;
}

.message + .message.sent:not(.received + .sent),
.message + .message.received:not(.sent + .received) {
    margin-top: 2px;
}

.message.sent + .message.received,
.message.received + .message.sent {
    margin-top: 12px;
}

.message .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
}

.message .header strong {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1px;
}

.message.sent .header {
    justify-content: flex-end;
}

.message .avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--on-primary);
    font-weight: 600;
    flex-shrink: 0;
    text-transform: uppercase;
}

.message.sent .avatar {
    background: rgba(255,255,255,0.25);
    order: 2;
}

.message .message-content {
    word-break: break-word;
    hyphens: auto;
}

.message .message-content p {
    margin: 0;
}

.message .message-content p + p {
    margin-top: 8px;
}

.message .message-content a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
}

.message.received .message-content a {
    color: var(--primary);
}

.message .message-content code {
    background: rgba(0,0,0,0.08);
    padding: 2px 6px;
    border-radius: var(--radius-xs);
    font-family: 'Roboto Mono', monospace;
    font-size: 0.875em;
}

.message.sent .message-content code {
    background: rgba(255,255,255,0.2);
}

.message .message-content pre {
    background: rgba(0,0,0,0.08);
    padding: 12px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
}

.message.sent .message-content pre {
    background: rgba(255,255,255,0.15);
}

.message .timestamp {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 4px;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.system-message {
    text-align: center;
    padding: 8px 16px;
    margin: 12px auto;
    font-size: 13px;
    color: var(--on-surface-variant);
    background: var(--surface-container);
    border-radius: var(--radius-full);
    max-width: fit-content;
    animation: systemFade 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
}

@keyframes systemFade {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.system-message.error {
    background: var(--error-container);
    color: var(--error);
}

.system-message.warning {
    background: var(--warning-container);
    color: var(--warning);
}

.system-message.success {
    background: var(--success-container);
    color: var(--success);
}

.input-container {
    background: var(--surface);
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    gap: 12px;
    border-top: 1px solid var(--outline-variant);
    flex-shrink: 0;
}

.input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
}

#messageInput {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid transparent;
    border-radius: var(--radius-xxl);
    background: var(--surface-container);
    color: var(--on-surface);
    font-size: 15px;
    font-family: inherit;
    line-height: 1.4;
    resize: none;
    transition: all var(--transition-fast);
}

#messageInput:hover {
    background: var(--surface-container-high);
}

#messageInput:focus {
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 2px var(--primary-container);
}

#messageInput::placeholder {
    color: var(--on-surface-variant);
}

#messageInput:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.input-info {
    font-size: 11px;
    color: var(--on-surface-variant);
    text-align: right;
    margin-top: 4px;
    padding-right: 4px;
    opacity: 0;
    transition: opacity var(--transition-fast);
}

.input-wrapper:focus-within .input-info {
    opacity: 1;
}

.send-button {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: var(--radius-full);
    border: none;
    background: var(--primary);
    color: var(--on-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-fast);
    box-shadow: var(--shadow-1);
    -webkit-tap-highlight-color: transparent;
}

.send-button .material-icons-round {
    font-size: 22px;
    transition: transform var(--transition-fast);
}

.send-button:hover:not(:disabled) {
    background: var(--primary-hover);
    box-shadow: var(--shadow-2);
}

.send-button:active:not(:disabled) {
    background: var(--primary-pressed);
    transform: scale(0.92);
    box-shadow: var(--shadow-1);
}

.send-button:active:not(:disabled) .material-icons-round {
    transform: translateX(2px);
}

.send-button:disabled {
    background: var(--surface-container-high);
    color: var(--on-surface-variant);
    box-shadow: none;
    cursor: not-allowed;
}

/* Responsive Design */
@media (max-width: 768px) {
    .app-bar {
        padding: 0 12px;
        height: 56px;
    }
    
    .logo-icon {
        width: 36px;
        height: 36px;
    }
    
    .logo-icon .material-icons-round {
        font-size: 20px;
    }
    
    h1 {
        font-size: 18px;
    }
    
    .room-info {
        gap: 6px;
    }
    
    .nav-link {
        display: none;
    }
    
    .status-chip span:not(.status-dot) {
        display: none;
    }
    
    .status-chip {
        padding: 8px;
    }
}

@media (max-width: 600px) {
    .message {
        max-width: 88%;
        margin-left: 0 !important;
        margin-right: 0 !important;
    }
    
    .input-container {
        padding: 10px 12px;
    }
    
    #messageInput {
        font-size: 16px; /* Prevents iOS zoom */
        padding: 10px 14px;
    }
    
    .send-button {
        width: 44px;
        height: 44px;
        min-width: 44px;
    }
    
    #userCount {
        display: none;
    }
}

.typing-indicator {
    padding: 8px 16px;
    font-size: 13px;
    color: var(--on-surface-variant);
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--surface-dim);
}

.typing-dots {
    display: flex;
    gap: 3px;
    align-items: center;
}

.typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--on-surface-variant);
    animation: typingBounce 1.4s infinite ease-in-out;
}

.typing-dot:nth-child(1) { animation-delay: 0s; }
.typing-dot:nth-child(2) { animation-delay: 0.16s; }
.typing-dot:nth-child(3) { animation-delay: 0.32s; }

@keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
}

.header-bar {
    background: var(--primary-container);
    padding: 16px 20px;
    border-bottom: 1px solid var(--outline-variant);
    animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

.welcome-content {
    max-width: 800px;
}

.instructions {
    font-size: 14px;
    color: var(--on-primary-container);
    line-height: 1.6;
}

.instructions strong {
    font-weight: 600;
}

.instructions em {
    font-style: italic;
}

.welcome-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}

.welcome-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    background: var(--surface);
    color: var(--on-surface);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    box-shadow: var(--shadow-1);
    transition: all var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
}

.welcome-chip:hover {
    box-shadow: var(--shadow-2);
    transform: translateY(-1px);
}

.welcome-chip:active {
    transform: translateY(0);
    box-shadow: var(--shadow-1);
}

.welcome-chip .material-icons-round {
    font-size: 18px;
    color: var(--primary);
}

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: var(--outline);
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--on-surface-variant);
}

/* Firefox scrollbar */
* {
    scrollbar-width: thin;
    scrollbar-color: var(--outline) transparent;
}

/* Selection styling */
::selection {
    background: var(--primary-container);
    color: var(--on-primary-container);
}

/* Reduce motion for accessibility */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* Print styles */
@media print {
    .app-bar,
    .input-container,
    .header-bar,
    .typing-indicator {
        display: none !important;
    }
    
    #chat {
        overflow: visible;
        height: auto;
    }
}

/* High contrast mode support */
@media (prefers-contrast: high) {
    :root {
        --outline: #000000;
        --outline-variant: #000000;
    }
    
    .message.received {
        border: 1px solid var(--outline);
    }
}
</style>
</head>
<body>

<header class="app-bar">
    <a class="brand" href="/" title="Go to main room">
        <div class="logo-icon">
            <span class="material-icons-round">forum</span>
        </div>
        <h1>thehellisthis</h1>
    </a>
    <div class="room-info">
        <span class="room-badge" id="roomName">main</span>
        <a class="nav-link" href="#" id="exploreLink">
            <span class="material-icons-round" style="font-size:18px;vertical-align:middle;margin-right:4px">explore</span>
            Explore
        </a>
        <span id="userCount">
            <span class="material-icons-round">group</span>
            <span id="userCountNum">0</span>
        </span>
        <div class="status-chip connected" id="statusChip">
            <span class="status-dot"></span>
            <span id="statusText">Connected</span>
        </div>
    </div>
</header>

<div class="header-bar" id="welcomeBanner">
    <div class="welcome-content">
        <p class="instructions">
            <strong>Welcome!</strong> Anonymous, ephemeral chat rooms. Share a link to invite others.
            Messages support <em>*markdown*</em> formatting. Everything disappears when you leave.
        </p>
        <div class="welcome-chips">
            <button class="welcome-chip" id="createRoomBtn">
                <span class="material-icons-round">add_circle</span>
                New Room
            </button>
            <button class="welcome-chip" id="dismissBanner">
                <span class="material-icons-round">close</span>
                Dismiss
            </button>
        </div>
    </div>
</div>

<div id="chat" role="log" aria-live="polite" aria-label="Chat messages" tabindex="0"></div>

<div id="typingIndicator" class="typing-indicator" role="status" aria-live="polite">
    <div class="typing-dots">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
    </div>
    <span id="typingText">Someone is typing...</span>
</div>

<footer class="input-container">
    <div class="input-wrapper">
        <input 
            id="messageInput" 
            type="text" 
            placeholder="Type a message..." 
            aria-label="Message input" 
            autocomplete="off" 
            maxlength="8000"
            spellcheck="true"
            enterkeyhint="send"
        />
        <div class="input-info">
            <span id="charCount">0</span> / 8000
        </div>
    </div>
    <button class="send-button" id="sendBtn" aria-label="Send message" type="button">
        <span class="material-icons-round">send</span>
    </button>
</footer>

<script>
// Production-grade frontend for real-time chat
// Features: proper error handling, accessibility, mobile support, disconnect recovery

class ChatApp {
    constructor() {
        this.ws = null;
        this.myAnimalName = null;
        this.myUserId = null;
        this.connected = false;
        this.reconnectAttempts = 0;
        this.maxReconnectAttempts = 10;
        this.messageCount = 0;
        this.maxMessages = 500;
        this.typingUsers = new Map();
        this.typingTimeout = null;
        this.isCurrentlyTyping = false;
        this.lastReadMessageId = null;
        this.audioContext = null;
        this.roomName = this.extractRoomName();
        this.shouldAutoScroll = true;
        this.lastScrollTop = 0;
        this.cleanupIntervalId = null;
        this.scrollTimeoutId = null;
        this.autoScrollTimeoutId = null;
        
        // DOM elements
        this.chat = document.getElementById('chat');
        this.input = document.getElementById('messageInput');
        this.sendButton = document.getElementById('sendBtn');
        this.userCountNumEl = document.getElementById('userCountNum');
        this.statusChip = document.getElementById('statusChip');
        this.typingIndicator = document.getElementById('typingIndicator');
        this.typingText = document.getElementById('typingText');
        this.statusText = document.getElementById('statusText');
        this.charCount = document.getElementById('charCount');
        this.roomNameEl = document.getElementById('roomName');
        this.welcomeBanner = document.getElementById('welcomeBanner');
        this.createRoomBtn = document.getElementById('createRoomBtn');
        
        this.init();
    }
    
    init() {
        this.setupEventListeners();
        this.initAudioContext();
        this.updateRoomName();
        this.connect();
        
        // Periodic cleanup of stale typing indicators (store ID for cleanup)
        this.cleanupIntervalId = setInterval(() => this.cleanupTypingIndicators(), 1000);
        
        // Monitor scroll position to control auto-scroll
        this.chat.addEventListener('scroll', (e) => {
            this.handleChatScroll();
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => this.cleanup());
        window.addEventListener('pagehide', () => this.cleanup());
    }
    
    setupEventListeners() {
        this.input.addEventListener('keydown', (e) => this.handleInputKeydown(e));
        this.input.addEventListener('input', (e) => this.handleInput(e));
        this.sendButton.addEventListener('click', () => this.sendMessage());
        this.sendButton.addEventListener('touchend', (e) => {
            e.preventDefault();
            this.sendMessage();
        });
        
        // Explore room link
        document.getElementById('exploreLink').addEventListener('click', (e) => {
            e.preventDefault();
            const rooms = ['mellow-forest', 'midnight-owl', 'coffee-talks', 'tech-minds', 'random-thoughts', 'chill-zone', 'late-night', 'creative-corner'];
            const room = rooms[Math.floor(Math.random() * rooms.length)];
            window.location.href = `/${room}`;
        });
        
        // Create room button
        this.createRoomBtn.addEventListener('click', () => {
            this.showCreateRoomDialog();
        });
        
        // Dismiss banner
        const dismissBtn = document.getElementById('dismissBanner');
        if (dismissBtn) {
            dismissBtn.addEventListener('click', () => {
                this.welcomeBanner.style.display = 'none';
                localStorage.setItem('bannerDismissed', 'true');
            });
        }
        
        // Check if banner was previously dismissed
        if (localStorage.getItem('bannerDismissed') === 'true') {
            this.welcomeBanner.style.display = 'none';
        }
        
        // Focus input on page load
        this.input.focus();
    }
    
    showCreateRoomDialog() {
        const roomName = prompt('Enter a room name (3-50 characters):\\n\\nAllowed: letters, numbers, hyphens, underscores\\nExample: my-cool-room');
        if (roomName) {
            const trimmed = roomName.trim().toLowerCase();
            if (/^[a-zA-Z0-9][a-zA-Z0-9-_]{1,48}[a-zA-Z0-9]$/.test(trimmed)) {
                window.location.href = `/${trimmed}`;
            } else {
                this.showError('Invalid room name. Use 3-50 characters: letters, numbers, hyphens, underscores.');
            }
        }
    }
    
    initAudioContext() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.audioContext = new AudioContext();
        } catch (e) {
            console.warn('AudioContext not available:', e);
        }
    }
    
    extractRoomName() {
        const pathParts = window.location.pathname.split('/').filter(p => p);
        return pathParts[pathParts.length - 1] || 'main';
    }
    
    updateRoomName() {
        this.roomNameEl.textContent = this.roomName;
    }
    
    connect() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsURL = `${protocol}//${location.host}/ws/${this.roomName}`;
        
        try {
            this.ws = new WebSocket(wsURL);
            
            this.ws.onopen = () => this.handleWebSocketOpen();
            this.ws.onclose = () => this.handleWebSocketClose();
            this.ws.onerror = (e) => this.handleWebSocketError(e);
            this.ws.onmessage = (e) => this.handleWebSocketMessage(e);
        } catch (e) {
            this.showError(`Failed to establish connection: ${e.message}`);
            this.updateConnectionStatus('disconnected');
        }
    }
    
    handleWebSocketOpen() {
        console.log('WebSocket connected');
        this.connected = true;
        if (this.reconnectAttempts > 0) {
            this.addSystemMessage('Reconnected successfully', 'success');
        }
        this.reconnectAttempts = 0;
        this.updateConnectionStatus('connected');
        this.sendButton.disabled = false;
        this.input.disabled = false;
        this.input.focus();
    }
    
    handleWebSocketClose() {
        console.log('WebSocket disconnected');
        this.connected = false;
        this.updateConnectionStatus('disconnected');
        this.sendButton.disabled = true;
        this.input.disabled = true;
        this.tryReconnect();
    }
    
    handleWebSocketError(error) {
        console.error('WebSocket error:', error);
    }
    
    handleWebSocketMessage(event) {
        try {
            const data = JSON.parse(event.data);
            this.handleServerEvent(data);
        } catch (e) {
            console.error('Failed to parse message:', e);
            this.showError('Received malformed message from server');
        }
    }
    
    tryReconnect() {
        if (this.reconnectAttempts >= this.maxReconnectAttempts) {
            this.showError('Unable to connect. Please refresh the page.');
            return;
        }
        
        const delay = Math.min(1000 * Math.pow(2, this.reconnectAttempts), 30000);
        this.updateConnectionStatus('connecting');
        
        // Update status text with countdown
        let remaining = Math.ceil(delay / 1000);
        this.statusText.textContent = `Reconnecting in ${remaining}s`;
        
        const countdownInterval = setInterval(() => {
            remaining--;
            if (remaining > 0 && !this.connected) {
                this.statusText.textContent = `Reconnecting in ${remaining}s`;
            } else {
                clearInterval(countdownInterval);
            }
        }, 1000);
        
        setTimeout(() => {
            clearInterval(countdownInterval);
            if (!this.connected && (!this.ws || this.ws.readyState !== WebSocket.CONNECTING)) {
                this.reconnectAttempts++;
                this.statusText.textContent = 'Connecting...';
                this.connect();
            }
        }, delay);
    }
    
    handleServerEvent(data) {
        switch (data.type) {
            case 'Message':
                this.handleIncomingMessage(data.message);
                break;
            case 'System':
                this.handleSystemEvent(data.event);
                break;
            case 'UserCount':
                this.updateUserCount(data.count);
                break;
            case 'Heartbeat':
                break;
            case 'ReconnectToken':
                console.log('Received reconnect token');
                break;
            default:
                console.warn('Unknown event type:', data.type);
        }
    }
    
    handleIncomingMessage(msg) {
        if (!msg || !msg.message_id) {
            console.warn('Invalid message received:', msg);
            return;
        }
        
        // Detect our own identity early from any message that has our user_id
        // This handles chat history on reconnect before UserJoined event
        if (msg.user_id && !this.myUserId) {
            // Check if this message matches our cookie user_id
            const cookies = document.cookie.split(';').map(c => c.trim());
            const userIdCookie = cookies.find(c => c.startsWith('user_id='));
            if (userIdCookie) {
                const cookieUserId = userIdCookie.split('=')[1];
                if (msg.user_id === cookieUserId) {
                    this.myUserId = cookieUserId;
                    this.myAnimalName = msg.animal_name;
                }
            }
        }
        
        // Also set from any message if we already know our user_id
        if (this.myUserId && msg.user_id === this.myUserId && !this.myAnimalName) {
            this.myAnimalName = msg.animal_name;
        }
        
        const isSent = (this.myUserId && msg.user_id === this.myUserId);
        this.renderMessage(msg, isSent);
        
        // Auto-scroll if user is at bottom
        if (this.shouldAutoScroll) {
            // Cancel any pending auto-scroll and schedule a new one
            if (this.autoScrollTimeoutId) {
                clearTimeout(this.autoScrollTimeoutId);
            }
            this.autoScrollTimeoutId = setTimeout(() => {
                this.chat.scrollTop = this.chat.scrollHeight;
                this.autoScrollTimeoutId = null;
            }, 0);
        }
        
        // Play notification for received messages
        if (!isSent) {
            this.playNotificationSound();
            
            // Auto-send read receipt if at bottom
            if (this.isAtBottom()) {
                this.sendReadReceipt(msg.message_id);
            }
        }
    }
    
    renderMessage(msg, isSent) {
        // Prevent duplicate message renders
        if (this.chat.querySelector(`[data-message-id="${msg.message_id}"]`)) {
            return;
        }
        
        const timestamp = this.formatTimestamp(this.parseTimestamp(msg.timestamp));
        
        const div = document.createElement('div');
        div.className = `message ${isSent ? 'sent' : 'received'}`;
        div.dataset.messageId = msg.message_id;
        div.dataset.userId = msg.user_id;
        div.setAttribute('role', 'article');
        div.setAttribute('aria-label', `Message from ${msg.animal_name} at ${timestamp}`);
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = this.escapeHtml(msg.animal_name[0]).toUpperCase();
        
        const header = document.createElement('div');
        header.className = 'header';
        const name = document.createElement('strong');
        name.textContent = this.escapeHtml(msg.animal_name);
        name.style.textOverflow = 'ellipsis';
        name.style.whiteSpace = 'nowrap';
        name.style.overflow = 'hidden';
        header.appendChild(avatar);
        header.appendChild(name);
        
        const content = document.createElement('div');
        content.className = 'message-content';
        content.innerHTML = msg.text; // Already sanitized by server
        
        const tsDiv = document.createElement('div');
        tsDiv.className = 'timestamp';
        tsDiv.textContent = timestamp;
        
        div.appendChild(header);
        div.appendChild(content);
        div.appendChild(tsDiv);
        
        this.chat.appendChild(div);
        
        // Increment count and cleanup if needed
        this.messageCount++;
        if (this.messageCount > this.maxMessages) {
            const oldestMessage = this.chat.querySelector('.message');
            if (oldestMessage) {
                oldestMessage.remove();
                this.messageCount--;
            }
        }
    }
    
    handleSystemEvent(event) {
        if (!event) return;
        
        if (event.UserJoined) {
            if (!this.myUserId) {
                this.myUserId = event.UserJoined.user_id;
                this.myAnimalName = event.UserJoined.animal_name;
                // Welcome message for the user themselves
                this.addSystemMessage(`You joined as ${this.escapeHtml(event.UserJoined.animal_name)} 🎉`, 'success');
            } else {
                this.addSystemMessage(`${this.escapeHtml(event.UserJoined.animal_name)} joined`, 'success');
            }
            this.messageCount++;
        } else if (event.UserLeft) {
            this.typingUsers.delete(event.UserLeft.animal_name);
            this.updateTypingIndicator();
            this.addSystemMessage(`${this.escapeHtml(event.UserLeft.animal_name)} left`);
            this.messageCount++;
        } else if (event.Typing) {
            this.handleTypingIndicator(event.Typing.animal_name, event.Typing.is_typing);
        } else if (event.ReadReceipt) {
            this.updateReadReceipt(event.ReadReceipt.animal_name, event.ReadReceipt.message_id);
        } else if (event.ServerShutdown) {
            this.addSystemMessage(`Server is restarting: ${event.ServerShutdown.reason}`, 'warning');
            this.messageCount++;
        }
        
        // Cleanup old system messages if needed
        if (this.messageCount > this.maxMessages) {
            const firstSystemMsg = this.chat.querySelector('.system-message');
            if (firstSystemMsg) {
                firstSystemMsg.remove();
                this.messageCount--;
            }
        }
        
        if (this.shouldAutoScroll) {
            if (this.autoScrollTimeoutId) {
                clearTimeout(this.autoScrollTimeoutId);
            }
            this.autoScrollTimeoutId = setTimeout(() => {
                this.chat.scrollTop = this.chat.scrollHeight;
                this.autoScrollTimeoutId = null;
            }, 0);
        }
    }
    
    handleTypingIndicator(name, isTyping) {
        if (name === this.myAnimalName) return;
        
        if (isTyping) {
            this.typingUsers.set(name, Date.now());
        } else {
            this.typingUsers.delete(name);
        }
        this.updateTypingIndicator();
    }
    
    cleanupTypingIndicators() {
        const now = Date.now();
        let cleaned = false;
        
        for (const [name, timestamp] of this.typingUsers) {
            if (now - timestamp > 5000) {
                this.typingUsers.delete(name);
                cleaned = true;
            }
        }
        
        if (cleaned) {
            this.updateTypingIndicator();
        }
    }
    
    updateTypingIndicator() {
        const names = Array.from(this.typingUsers.keys());
        
        if (names.length === 0) {
            this.typingIndicator.style.display = 'none';
        } else {
            let text;
            if (names.length === 1) {
                text = `${this.escapeHtml(names[0])} is typing...`;
            } else if (names.length === 2) {
                text = `${this.escapeHtml(names[0])} and ${this.escapeHtml(names[1])} are typing...`;
            } else {
                text = `${names.length} people are typing...`;
            }
            
            this.typingText.textContent = text;
            this.typingIndicator.style.display = 'flex';
        }
    }
    
    updateReadReceipt(animal_name, message_id) {
        if (animal_name === this.myAnimalName) {
            this.lastReadMessageId = message_id;
        }
    }
    
    handleInputKeydown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            this.sendMessage();
        }
    }
    
    handleInput(e) {
        const text = e.target.value;
        this.charCount.textContent = text.length;
        
        // Send typing indicator
        if (text.length > 0) {
            this.handleTyping();
        } else {
            this.cancelTyping();
        }
    }
    
    handleTyping() {
        if (!this.isCurrentlyTyping) {
            this.isCurrentlyTyping = true;
            this.sendTypingIndicator(true);
        }
        
        if (this.typingTimeout) clearTimeout(this.typingTimeout);
        this.typingTimeout = setTimeout(() => {
            this.cancelTyping();
        }, 3000);
    }
    
    cancelTyping() {
        if (this.isCurrentlyTyping) {
            this.isCurrentlyTyping = false;
            this.sendTypingIndicator(false);
        }
    }
    
    sendMessage() {
        const text = this.input.value.trim();
        
        if (!text) {
            this.input.focus();
            return;
        }
        
        if (!this.connected) {
            this.showError('Not connected. Attempting to reconnect...');
            return;
        }
        
        if (text.length > 8000) {
            this.showError('Message is too long (max 8000 characters)');
            return;
        }
        
        try {
            this.ws.send(JSON.stringify({ type: 'Message', text }));
            this.input.value = '';
            this.charCount.textContent = '0';
            this.isCurrentlyTyping = false;
            if (this.typingTimeout) clearTimeout(this.typingTimeout);
            this.sendTypingIndicator(false);
            this.input.focus();
        } catch (e) {
            console.error('Failed to send message:', e);
            this.showError('Failed to send message. Please try again.');
        }
    }
    
    sendTypingIndicator(is_typing) {
        if (this.connected && this.ws.readyState === WebSocket.OPEN) {
            try {
                this.ws.send(JSON.stringify({ type: 'Typing', is_typing }));
            } catch (e) {
                console.warn('Failed to send typing indicator:', e);
            }
        }
    }
    
    sendReadReceipt(message_id) {
        if (this.connected && message_id && this.ws.readyState === WebSocket.OPEN) {
            try {
                this.ws.send(JSON.stringify({ type: 'ReadReceipt', message_id }));
            } catch (e) {
                console.warn('Failed to send read receipt:', e);
            }
        }
    }
    
    handleChatScroll() {
        const wasAtBottom = this.shouldAutoScroll;
        this.shouldAutoScroll = this.isAtBottom();
        
        // Only send read receipt if user just scrolled to bottom (debounce)
        if (this.shouldAutoScroll && !wasAtBottom) {
            const messages = this.chat.querySelectorAll('.message');
            if (messages.length > 0) {
                const lastMsg = messages[messages.length - 1];
                const messageID = lastMsg.dataset.messageId;
                if (messageID && messageID !== this.lastReadMessageId) {
                    this.sendReadReceipt(messageID);
                }
            }
        }
    }
    
    isAtBottom() {
        return this.chat.scrollHeight - this.chat.scrollTop - this.chat.clientHeight < 50;
    }
    
    updateUserCount(count) {
        this.userCountNumEl.textContent = count;
    }
    
    updateConnectionStatus(status) {
        this.statusChip.className = `status-chip ${status}`;
        
        switch (status) {
            case 'connected':
                this.statusText.textContent = 'Connected';
                break;
            case 'disconnected':
                this.statusText.textContent = 'Disconnected';
                break;
            case 'connecting':
                this.statusText.textContent = 'Connecting...';
                break;
        }
    }
    
    addSystemMessage(text, type = 'info') {
        const div = document.createElement('div');
        div.className = `system-message ${type}`;
        div.setAttribute('role', 'status');
        div.textContent = text;
        this.chat.appendChild(div);
        
        // Auto-remove after 8 seconds
        setTimeout(() => {
            if (div.parentNode) {
                div.remove();
            }
        }, 8000);
    }
    
    showError(message) {
        this.addSystemMessage(message, 'error');
    }
    
    playNotificationSound() {
        if (!this.audioContext) return;
        
        try {
            // Resume context if suspended (mobile requirement)
            if (this.audioContext.state === 'suspended') {
                this.audioContext.resume();
            }
            
            // Simple beep sound
            const oscillator = this.audioContext.createOscillator();
            const gainNode = this.audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(this.audioContext.destination);
            
            oscillator.frequency.value = 880;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
            
            oscillator.start(this.audioContext.currentTime);
            oscillator.stop(this.audioContext.currentTime + 0.2);
        } catch (e) {
            console.warn('Failed to play notification sound:', e);
        }
    }
    
    parseTimestamp(ts) {
        // Validate timestamp - if less than 1e12, assume seconds and convert to ms
        const num = parseInt(ts);
        return num < 1e12 ? num * 1000 : num;
    }
    
    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    formatTimestamp(ms) {
        const date = new Date(ms);
        return date.toLocaleTimeString([], { 
            hour: '2-digit', 
            minute: '2-digit',
            hour12: true 
        });
    }
    
    cleanup() {
        // Clear all timers and intervals
        if (this.cleanupIntervalId) {
            clearInterval(this.cleanupIntervalId);
            this.cleanupIntervalId = null;
        }
        if (this.typingTimeout) {
            clearTimeout(this.typingTimeout);
            this.typingTimeout = null;
        }
        if (this.scrollTimeoutId) {
            clearTimeout(this.scrollTimeoutId);
            this.scrollTimeoutId = null;
        }
        // Clear pending auto-scroll timeout
        if (this.autoScrollTimeoutId) {
            clearTimeout(this.autoScrollTimeoutId);
            this.autoScrollTimeoutId = null;
        }
        // Close WebSocket if open
        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
            this.ws.close();
        }
    }
}

// Initialize app when DOM is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        new ChatApp();
    });
} else {
    new ChatApp();
}
</script>
</body>
