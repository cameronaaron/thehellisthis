# Code the coverage floor does not count, and why.
#
# The floor is 100%. Anything below it is either a missing test or an entry
# here — never a lowered number. Ported from the coverage exclusion list on
# cameronaaron.com, which holds its thresholds at 100 and excludes a short,
# reasoned list rather than settling for a percentage.
#
# Two rules, both enforced by `coverage_exemptions_are_justified_and_current`:
#
#   1. Every entry carries a `reason`. An exclusion without one is a number
#      being hidden.
#   2. Every entry names a path that exists. An exemption must never outlive
#      the thing it exempts — the same self-cleaning property the dependency
#      allow-list has.

[[exempt]]
path = "src/tests.rs"
reason = """
The test suite itself. Coverage measures whether the *server* is exercised;
counting the tests' own branches measures nothing, and a helper with an
unexercised arm would otherwise show up as untested production code. This is
the direct analogue of excluding `**/*.test.ts` on cameronaaron.com.
"""

[[exempt]]
path = "src/main.rs"
reason = """
The process shell, and only after everything testable was moved out of it.
`main` is one line that calls `main_inner`, because a test can never call
`main` — `#[tokio::main]` makes it the entry point — so any line left inside it
is a line nothing can ever cover.

What remains uncovered here is the `#[tokio::main]` runtime construction and
the `signal::ctrl_c()` call itself. The shutdown *sequence* is covered:
`wait_then_announce` takes the signal as a parameter precisely so a test can
supply one, including the failed-handler arm.

Reopen: if this file grows anything that is not runtime setup, it belongs in a
module and this exemption stops being honest.
"""

# ---------------------------------------------------------------------------
# Lines, not files.
#
# tarpaulin can only exclude whole files, and `session.rs` is 94% covered — the
# module holding the message path, admission and teardown. Excluding it to
# reach a round number would hide far more than it exempted, so it stays in the
# measurement and the floor sits at what is actually achieved.
#
# The 21 lines below are listed individually with reasons.
# `session_coverage_gap_is_still_what_it_claims` fails if the count changes in
# either direction: a new uncovered line is a missing test, and a smaller
# number means an entry here has stopped being true and should be deleted.
# ---------------------------------------------------------------------------

[[exempt]]
path = "src/session.rs"
lines = 12
reason = """
Down from 21. Everything that could be reached by moving the untestable thing
to a parameter has been (§6.1c): the four connection tasks are now generic over
their sink, so "the client stopped accepting frames" is a test fixture rather
than a race, and `join_room` and `send_history` are functions rather than
blocks. What is left is four kinds of genuinely unreachable line.

**Serialisation that cannot fail** (309-310, 363). `serde_json::to_string` of an
`OutgoingEvent` or a `HistoryEvent` — plain structs and enums of owned strings,
numbers and UUIDs, with no map keys that could be non-strings and no float that
could be NaN. The arms stay because the signature is fallible and silently
ignoring an error is worse than a branch nothing reaches.

**Encoding an identity as a cookie** (177). Reachable only if a `user_id` or
`animal_name` contained a character invalid in a header value — which, since
identity became a closed set of UUIDs and roster names (§5.9), has no way to
happen. It is unreachable *because* the guard above it holds, and it should
stay as the thing that catches that guard being widened.

**Two `return`s inside `run_session`** (543, 561), taken when `join_room`
refuses or the client leaves mid-replay. Both decisions are covered directly —
`joining_a_room_that_vanished_is_refused_rather_than_panicking` and
`a_client_that_leaves_mid_replay_stops_the_replay` — but the two statements that
act on them live in a function that needs a real upgraded `WebSocket`, which
only axum can construct from a live handshake.

**Loop headers and a `break` tarpaulin attributes oddly** (323, 388, 394, 408,
410, 608). These sit inside `send_pings` and `beat_and_evict_idle`, both of
which have tests that demonstrably enter the loop, send frames and exit through
the branch in question — `pinging_stops_when_the_client_is_gone`,
`a_quiet_user_is_evicted_with_the_close_frame`,
`the_heartbeat_stops_when_the_client_is_gone`. The instrument and the code
disagree here, and §0.5 says to say so rather than write a worse test to please
the instrument.
"""
