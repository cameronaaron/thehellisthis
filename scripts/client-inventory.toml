# The shipped client's inventory.
#
# Everything listed here exists today and must keep existing. It is not a style
# guide or a wish list — it is a record of what the page is *made of*, so that
# deleting a piece of it fails the gate instead of being noticed by a visitor.
#
# This file exists because three regressions in one afternoon had the same
# cause: a bulk mechanical edit over the stylesheet removed rules it was not
# aimed at, and nothing knew they were supposed to be there. A visitor reported
# one. The other two were found by auditing afterwards, which is not a
# mechanism.
#
# **When the contract fails, that is the question being asked, not an obstacle.**
# Either the removal was an accident — restore it — or it was deliberate, in
# which case delete the line here in the same commit. Editing this file is how
# you say "yes, I meant that"; there is no way to remove something quietly.
#
# See what changed with:
#     scripts/client-inventory.sh
#
# It prints what is missing and what is new, so adding a feature is a diff you
# read rather than a list you retype.

