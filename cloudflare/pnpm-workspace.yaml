# pnpm settings for the Worker toolchain.
#
# pnpm 11 keeps installer configuration here rather than in package.json.

# A floor on a transitive dependency, regardless of what asks for it.
# `wrangler` pulls `undici` in; older releases carried advisories, so this
# pins the whole tree above them rather than trusting whatever the top-level
# range happens to resolve to today. pnpm reads overrides here — the npm-style
# `overrides` block in package.json is silently ignored, so under npm this floor
# was enforced and under pnpm it was merely coincidental until it moved here.
overrides:
  undici: '^7.29.0'

# pnpm refuses to run a dependency's install scripts unless it is named here.
# That default is the right one — an install script is arbitrary code from a
# transitive dependency, running in CI with the deploy credentials in the
# environment — but these two *are* the toolchain, and without them
# `wrangler deploy` has no bundler and no runtime to build against:
#
#   esbuild  links its platform binary; wrangler bundles the Worker with it
#   workerd  is the Workers runtime that `wrangler dev` and the build run on
#
# Adding anything else here is a decision to execute someone else's code at
# install time. Make it deliberately.
allowBuilds:
  esbuild: true
  workerd: true

# pnpm gates packages published very recently, so a compromised release has to
# survive a waiting period before anything can install it.
# `@cloudflare/workers-types` is a types-only package regenerated by
# `wrangler types` on Cloudflare's own release cadence, so a freshly published
# version is the normal case rather than a signal. Pinned to the exact version
# so a *different* new release still gets the waiting period.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260727.1'

# Fail the install on a Node too old for the toolchain, rather than letting it
# succeed and the *deploy* fail minutes later. wrangler needs >= 22 and pnpm 11
# needs `node:sqlite`; with CI pinned to Node 20 the gate stayed green while
# every deploy failed, because nothing checked the requirement until the last
# step. `engines` in package.json is the single source; this is what enforces it.
engineStrict: true
