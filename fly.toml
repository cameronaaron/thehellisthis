# Fly.io app configuration
# Replace "thehellisthis" with your Fly app name if different
app = "thehellisthis"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  # Uses local Dockerfile by default

[env]
  PORT = "3000"
  RUST_LOG = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25
