name: CI

on:
  pull_request:
    branches: [main]
  # On a push to main, deploy.yml calls this workflow and waits for it, so
  # there is no `push` trigger here — it would run the same gate twice.
  workflow_call:
  workflow_dispatch:
  # A dependency doesn't get less vulnerable between pushes: RUSTSEC and npm
  # advisories are published against versions already pinned in the lockfile.
  # Weekly is frequent enough to matter and rare enough not to be noise.
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One job running the same four commands as the local gate, in the same
  # order. Split jobs would parallelise better but would no longer answer the
  # question that matters: "does the gate pass?" — see ENGINEERING-STANDARDS.md
  # §6.1. Compilation is shared across all four steps, which more than pays for
  # the lost parallelism.
  gate:
    name: Gate (fmt, clippy, test, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are failures)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release

      - name: Verify binary exists
        run: test -f target/release/infinite-chat

  # Separate job: tarpaulin rebuilds with instrumentation, so it cannot share
  # the gate job's artifacts anyway, and running it in parallel keeps it off the
  # critical path to a deploy.
  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Enforce the coverage floor
        run: scripts/coverage.sh

  # The Worker is TypeScript and deploys alongside the container; a type error
  # here fails the deploy after the Rust gate has already passed.
  worker:
    name: Worker typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `packageManager` in cloudflare/package.json pins the pnpm version, and
      # this action installs exactly that one — so CI, the deploy job and a
      # developer's machine all resolve dependencies identically.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cloudflare/package.json

      - uses: actions/setup-node@v4
        with:
          # 24, not 20. wrangler requires Node >= 22 and pnpm 11 needs
          # `node:sqlite`, which Node 20 does not have. Pinned to 20, the deploy
          # step failed on every push for hours while the gate stayed green —
          # see cloudflare/package.json `engines`, which is the single source of
          # this requirement, and `ci_node_version_satisfies_the_toolchain`.
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'cloudflare/pnpm-lock.yaml'

      # `--frozen-lockfile` is the point of running this in CI: it fails rather
      # than quietly updating the lockfile, so what CI type-checks is what the
      # deploy installs.
      - name: Install
        working-directory: cloudflare
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: cloudflare
        run: pnpm exec tsc --noEmit

      - name: Audit
        working-directory: cloudflare
        run: pnpm audit --audit-level=high

  # Advisories are a moving target — new ones get published against crates
  # already in Cargo.lock — so this runs on every push, not just when
  # dependencies change. A green run today says nothing about tomorrow.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
