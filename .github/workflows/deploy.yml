name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  # Deploying is what makes a red gate matter. This workflow used to run
  # independently of CI, so a push with failing tests — or failing clippy, which
  # was red and unnoticed for some time — deployed anyway.
  # See ENGINEERING-STANDARDS.md §6.1.
  gate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'cloudflare/package-lock.json'

      - name: Install dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Deploy to Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --no-cache
