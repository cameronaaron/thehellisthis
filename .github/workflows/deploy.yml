name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  # Deploying is what makes a red gate matter. This workflow used to run
  # independently of CI, so a push with failing tests — or failing clippy, which
  # was red and unnoticed for some time — deployed anyway.
  # See ENGINEERING-STANDARDS.md §6.1.
  gate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: cloudflare/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24, not 20. wrangler requires Node >= 22 and pnpm 11 needs
          # `node:sqlite`, which Node 20 does not have. Pinned to 20, the deploy
          # step failed on every push for hours while the gate stayed green —
          # see cloudflare/package.json `engines`, which is the single source of
          # this requirement, and `ci_node_version_satisfies_the_toolchain`.
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'cloudflare/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: cloudflare
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --no-cache is not a flag `wrangler deploy` recognises in the pinned
        # wrangler version (it dumps the full --help text and exits 1, which
        # looks identical to an auth failure and cost real time to tell apart
        # from one). The container image build already has no persistent cache
        # to invalidate in a fresh runner, so there is nothing this flag would
        # have bought even if it existed.
        run: pnpm exec wrangler deploy
